<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Líder Responsable 360° | D1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-container">
    <div class="login-card">
        <h3 class="fw-bold" style="color: var(--d1-blue);">INICIAR SESIÓN</h3>
        <p class="text-muted small">Programa Líder Responsable 360°</p>
        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Nombre de Usuario</label>
                <input type="text" id="userInput" class="form-control" placeholder="Ej: Abel Polo" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Rol en Tienda</label>
                <select id="roleInput" class="form-select">
                    <option value="Trabajador">Colaborador Operativo</option>
                    <option value="Supervisor">Jefe de Tienda / Supervisor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-d1 w-100 py-2 mt-3 shadow-sm">INGRESAR</button>
        </form>
    </div>
</div>

<div id="dashboard" style="display:none;">
    <nav class="navbar navbar-d1 px-4 py-2 d-flex justify-content-between text-white">
        <span class="h1 mb-0">TIENDAS D1</span>
        <button class="btn btn-light btn-sm fw-bold" onclick="location.reload()">Salir</button>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3">
                <div class="nav flex-column nav-pills mt-4">
                    <button class="nav-link active" onclick="showTab('home')">Panel</button>
                    <button class="nav-link" onclick="showTab('canal')">Canal Ético</button>
                </div>
            </nav>
            <main class="col-md-10 p-4">
                <div id="welcome-area" class="welcome-banner shadow">
                    <div class="user-badge" id="display-role"></div>
                    <h2 id="display-name"></h2>
                    <p>Líder Responsable 360°: Estrategia de control y bienestar[cite: 27].</p>
                </div>
                </main>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
