<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Líder Responsable | Tiendas D1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-container">
    <div class="auth-card shadow-lg">
        <img src="https://logowik.com/content/uploads/images/tiendas-d11519.logowik.com.webp" alt="Logo D1" class="login-logo">
        
        <div class="bienestar-contenedor mb-4">
            <h5 class="fw-bold d1-blue-text">Nos importa tu bienestar</h5>
            <p class="text-muted small">Programa Líder Responsable: Tu seguridad es nuestra prioridad.</p>
        </div>

        <div id="login-section">
            <h3 class="fw-bold d1-blue-text mb-3">INICIAR SESIÓN</h3>
            <form id="loginForm">
                <input type="text" id="loginUser" class="form-control mb-3" placeholder="Usuario" required>
                <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña" required>
                <button type="submit" class="btn btn-d1 w-100">INGRESAR</button>
            </form>
            <button class="btn btn-link btn-sm mt-3" id="btn-ir-a-registro">¿No tienes cuenta? Regístrate aquí</button>
        </div>

        <div id="register-section" style="display:none;">
            <h3 class="fw-bold d1-blue-text mb-3">CREAR CUENTA</h3>
            <form id="registerForm">
                <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre Completo" required>
                <input type="text" id="regUser" class="form-control mb-2" placeholder="Nuevo Usuario" required>
                <input type="password" id="regPass" class="form-control mb-2" placeholder="Contraseña" required>
                <select id="regRole" class="form-select mb-3">
                    <option value="Trabajador Operativo">Trabajador Operativo</option>
                    <option value="Supervisor / Jefe de Tienda">Supervisor / Jefe de Tienda</option>
                </select>
                <button type="submit" class="btn btn-d1 w-100">REGISTRARSE</button>
            </form>
            <button class="btn btn-link btn-sm mt-3" id="btn-ir-a-login">Volver al Inicio</button>
        </div>
    </div>
</div>

<div id="dashboard" style="display:none;">
    <nav class="navbar navbar-d1 px-4 py-2 shadow">
        <div class="d-flex align-items-center">
            <span class="h1 mb-0 fw-bold text-white">TIENDAS D1</span>
        </div>
        <button class="btn btn-outline-light btn-sm fw-bold" onclick="location.reload()">CERRAR SESIÓN</button>
    </nav>
    <div class="container mt-4">
        <div class="welcome-banner shadow-sm p-4">
            <h2 id="display-name" class="fw-bold"></h2>
            <span id="display-role" class="badge bg-white text-primary p-2"></span>
        </div>
        <div class="card p-4 border-0 shadow-sm mt-3 border-top border-danger border-5">
            <h4>Panel de Control - Programa Líder Responsable</h4>
            <p>Estado actual de la tienda: <strong>Óptimo (Verde)</strong></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
