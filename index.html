<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Líder Responsable | D1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-container">
    <div class="auth-card shadow-lg">
        <img src="https://logowik.com/content/uploads/images/tiendas-d11519.logowik.com.webp" alt="Logo D1" class="login-logo">
        
        <div id="login-section">
            <h3 class="fw-bold d1-blue-text">INICIAR SESIÓN</h3>
            <p class="text-muted small">Acceso al Programa Líder Responsable</p>
            <form id="loginForm">
                <input type="text" id="loginUser" class="form-control mb-3" placeholder="Usuario" required>
                <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña" required>
                <button type="submit" class="btn btn-d1 w-100">INGRESAR</button>
            </form>
            <button class="btn btn-link btn-sm mt-3" id="btn-ir-a-registro">¿No tienes cuenta? Regístrate aquí</button>
        </div>

        <div id="register-section" style="display:none;">
            <h3 class="fw-bold d1-blue-text">CREAR USUARIO</h3>
            <form id="registerForm">
                <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre Completo" required>
                <input type="text" id="regUser" class="form-control mb-2" placeholder="Nuevo Usuario" required>
                <input type="password" id="regPass" class="form-control mb-2" placeholder="Contraseña" required>
                <select id="regRole" class="form-select mb-3">
                    <option value="Trabajador">Trabajador Operativo</option>
                    <option value="Supervisor">Supervisor / Jefe de Tienda</option>
                </select>
                <button type="submit" class="btn btn-d1 w-100">CREAR CUENTA</button>
            </form>
            <button class="btn btn-link btn-sm mt-3" id="btn-ir-a-login">¿Ya tienes cuenta? Inicia Sesión</button>
        </div>
    </div>
</div>

<div id="dashboard" style="display:none;">
    <nav class="navbar navbar-d1 px-4 py-2 shadow">
        <div class="d-flex align-items-center">
            <span class="h1 mb-0 fw-bold text-white">TIENDAS D1</span>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="location.reload()">SALIR</button>
    </nav>
    <div class="p-4">
        <div class="welcome-banner shadow-sm">
            <h2 id="display-name" class="fw-bold"></h2>
            <p id="display-role" class="badge bg-white text-primary"></p>
        </div>
        <div class="card p-4 border-0 shadow-sm mt-3">
            <h4>Panel de Control - Líder Responsable</h4>
            <p>Estado de Tienda: <strong>Óptimo (Verde)</strong></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
